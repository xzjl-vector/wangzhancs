    <main>
        <div class="message-container">
            <h3>留言</h3>
            <form action="#" method="post">
                <div class="form-group">
                    <input type="text" class="form-control" placeholder="姓名" required>
                </div>
                <div class="form-group">
                    <input type="tel" class="form-control" placeholder="手机" required>
                </div>
                <div class="form-group">
                    <textarea class="form-control" placeholder="留言内容" required></textarea>
                </div>
                <div class="btn-group">
                    <button type="submit" class="submit-btn">提交</button>
                    <button type="reset" class="reset-btn">重置</button>
                </div>
            </form>
        </div>
    </main>
    <footer>
        <p>网页示例</p>
    </footer>
